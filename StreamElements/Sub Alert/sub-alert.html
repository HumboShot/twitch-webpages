<div class="sub-container">
  <div class="scanlines"></div>

  <div class="main-wrapper">
    <div class="terminal-header">
      <span class="prefix">> ACCESS: GRANTED<span class="cursor">_</span></span>
      <div class="access-level">ENCRYPTION: LEVEL_{{tier}}</div>
    </div>

    <div class="glitch-wrapper">
      <h1 class="main-text" id="sub-name" data-value="{{name}} // JOINED_THE_CREW" data-name="{{name}}">
        {{name}} // JOINED_THE_CREW
      </h1>
    </div>

    <div class="data-block">
      <div class="status-led"></div>
      <div class="data-label">UPTIME_RECORD:</div>
      <div class="data-value red-glow" id="sub-count" data-count="{{amount}}">000</div>
      <div class="data-unit">MONTHS</div>
    </div>

    <div class="hud-line"></div>

    <div class="stats-box">
      <span class="status">CITIZEN_ID: {{name}}</span>
      <span class="coord">AUTH_CODE: <span id="auth-hash">--------</span></span>
    </div>
  </div>
</div>
