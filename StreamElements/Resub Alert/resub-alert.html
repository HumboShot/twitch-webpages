<div class="resub-container">
    <div class="scanlines"></div>

    <div class="main-wrapper">
        <div class="terminal-header">
            <span class="prefix">> RUN: LOYALTY_RENEWAL.EXE<span class="cursor">_</span></span>
            <div class="loyalty-status">STATUS: VETERAN_UNIT_CONFIRMED</div>
        </div>

        <div class="glitch-wrapper">
            <h1 class="main-text" id="resub-name" data-value="{{name}} // UPTIME_EXTENDED">
                {{name}} // UPTIME_EXTENDED
            </h1>
        </div>

        <div class="data-block">
            <div class="status-led"></div>
            <div class="data-label">ACCUMULATED_UPTIME:</div>
            <div class="data-value red-glow" id="resub-count" data-count="{{amount}}">000</div>
            <div class="data-unit">MONTHS</div>
        </div>

        <div class="hud-line"></div>

        <div class="stats-box">
            <span class="status">ENCRYPTION: TIER_{{tier}}</span>
            <span class="coord">STABILITY_CHECK: 100%</span>
            <span class="auth">0x8A2387</span>
        </div>
    </div>
</div>
