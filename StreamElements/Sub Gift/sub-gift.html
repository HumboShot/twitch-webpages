<div class="gift-container">
    <div class="scanlines"></div>

    <div class="main-wrapper">
        <div class="terminal-header">
            <span class="prefix">> INITIATE: DIRECT_CONNECTION_HANDSHAKE<span class="cursor">_</span></span>
            <div class="recruiter-tag">ENCRYPTION: INDIVIDUAL_HANDSHAKE</div>
        </div>

        <div class="glitch-wrapper">
            <h1 class="main-text" id="gift-name" data-value="{{sender}} // RECRUITER_ACTIVE">
                {{sender}} // RECRUITER_ACTIVE
            </h1>
        </div>

        <div class="data-block">
            <div class="status-led"></div>
            <div class="data-label">CONNECTION_ESTABLISHED: <span class="target-name">{{name}}</span></div>
        </div>

        <div class="hud-line"></div>

        <div class="stats-box">
            <span class="status">RECRUITER_LEVEL: <span id="total-gifts" data-total="{{senderCount}}">000</span></span>
            <span class="coord">AUTH_ID: 0x8A2387_GIFTPASS</span>
        </div>
    </div>
</div>
