<div class="raid-container">
    <div class="scanlines"></div>

    <div class="main-wrapper">
        <div class="terminal-header">
            <span class="prefix">> ALERT: SYSTEM_INTRUSION<span class="cursor">_</span></span>
            <div class="threat-level">THREAT LEVEL: CRITICAL</div>
        </div>

        <div class="glitch-wrapper">
            <h1 class="main-text" id="raider-name" data-value="{{name}} // COMMENCING RAIDING!" data-name="{{name}}">
                {{name}} // COMMENCING_RAIDING
            </h1>
        </div>

        <div class="data-block">
            <div class="status-led"></div>
            <div class="data-label">INCOMING_SIGNALS:</div>
            <div class="data-value red-glow" id="raider-count" data-count="{{amount}}">000</div>
        </div>

        <div class="hud-line"></div>

        <div class="stats-box">
            <span class="status">H-SYSTEM: ENHANCED_MODE</span>
            <span class="coord">RAID_HASH: <span id="raid-hash">--------</span></span>
        </div>
    </div>
</div>
